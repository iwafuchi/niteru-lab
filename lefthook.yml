# フック実行前に読み込む sh スクリプト。mise.toml のツールを PATH に通す
rc: ./.lefthookrc

# コミット前：ステージしたファイルだけを素早くチェックする
pre-commit:
  parallel: true
  jobs:
    # ステージした差分に認証情報（AWS キー、トークンなど）が含まれていないか検査する
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose

    - name: format
      glob: "*.{ts,mts,cts,js,mjs,cjs,json,jsonc,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}

# コミットメッセージの検査（{1} はメッセージが書かれたファイルのパス）
commit-msg:
  jobs:
    # Conventional Commits の形式と、意味の伝わらない subject を検査する
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

    # メッセージ本文に認証情報が含まれていないか検査する
    - name: secrets
      run: gitleaks stdin --redact --no-banner --verbose < {1}

# プッシュ前：プロジェクト全体を対象にする検査（ファイル単位では判定できないため）
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      glob: "*.{ts,mts,cts}"
      run: pnpm typecheck

    # 仕様からずれた変更を push する前に止める（unit と integration）
    - name: test
      glob: "*.{ts,mts,cts,json}"
      run: pnpm test
